version: '3.9'

services:
  # Base de données MariaDB
  mariadb:
    image: mariadb:11.2
    container_name: zenquo-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-zenquo}
      MYSQL_USER: ${DB_USER:-zenquo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zenquo123}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    networks:
      - zenquo-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin pour gérer la DB
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: zenquo-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-zenquo}
      PMA_PASSWORD: ${DB_PASSWORD:-zenquo123}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    networks:
      - zenquo-network
    depends_on:
      mariadb:
        condition: service_healthy

  # Application Nuxt
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 25
    container_name: zenquo-nuxt
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: mysql://${DB_USER:-zenquo}:${DB_PASSWORD:-zenquo123}@mariadb:3306/${DB_NAME:-zenquo}

      # Auth
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:3002}

      # App
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3002}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      # Mount code en dev pour hot reload
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "${NUXT_PORT:-3002}:3000"
    networks:
      - zenquo-network
    depends_on:
      mariadb:
        condition: service_healthy
    command: npm run dev

volumes:
  mariadb_data:
    driver: local

networks:
  zenquo-network:
    driver: bridge
